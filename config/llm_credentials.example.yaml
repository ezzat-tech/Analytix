# ============================================
# LLM API Credentials
# ============================================
#
# Copy this file to llm_credentials.yaml and add your keys:
#   cp llm_credentials.example.yaml llm_credentials.yaml
#
# IMPORTANT: Do NOT commit llm_credentials.yaml to version control.
# It is already listed in .gitignore.
#
# API keys can also be set via environment variables:
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY
# Environment variables take precedence over this file.
# ---------------------------------------------

# OpenAI API Key
# openai:
#   api_key: sk-...

# Anthropic API Key
# claude:
#   api_key: sk-ant-...
